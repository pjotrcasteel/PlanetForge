name: Validate PlanetForge

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'PlanetForge.slnx'
      - 'Directory.Build.props'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PlanetForge.slnx

      - name: Build
        run: dotnet build PlanetForge.slnx -c Release --no-restore

      - name: Validate browser JavaScript
        run: node --check src/PlanetForge.Presentation.Web/wwwroot/js/planetRenderer.js

      - name: Test
        run: dotnet test PlanetForge.slnx -c Release --no-build

      - name: Publish web
        run: dotnet publish src/PlanetForge.Presentation.Web/PlanetForge.Presentation.Web.csproj -c Release --no-restore
