name: Validate PlanetForge

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'PlanetForge.slnx'
      - 'Directory.Build.props'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: planetforge-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-checks:
    name: Build, .NET tests and WASM publish
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Restore
        run: dotnet restore PlanetForge.slnx

      - name: Build
        run: dotnet build PlanetForge.slnx -c Release --no-restore

      - name: Validate browser JavaScript
        run: find src/PlanetForge.Presentation.Web/wwwroot/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate playable prototype state
        run: node --test tests/PlanetForge.Browser.Tests/demo/formation-demo-model.test.mjs

      - name: Validate thermal playback across slow and fast frames
        run: node --test tests/PlanetForge.Browser.Tests/evolution-thermal-playback.test.mjs

      - name: Validate opt-in performance statistics
        run: node --test tests/PlanetForge.Browser.Tests/performance-metrics.test.mjs

      - name: Validate automated benchmark report formatting
        run: |
          node --test tests/PlanetForge.Browser.Tests/automation/report-baseline.test.mjs
          node --check tests/PlanetForge.Browser.Tests/automation/collect-baseline.mjs
          node --check tests/PlanetForge.Browser.Tests/automation/publish-baseline.mjs

      - name: Reject whole-canvas planet grayscale filters
        run: |
          if grep -R -n -E '#planet-canvas[^\{]*\{[^}]*filter:[^;}]*grayscale|pre-vegetation-world[^\{]*#planet-canvas[^\{]*\{[^}]*filter:' src/PlanetForge.Presentation.Web/wwwroot/css; then
            echo 'Whole-canvas planet filters are forbidden; land/water palettes must be handled in the renderer.'
            exit 1
          fi

      - name: Test
        run: dotnet test PlanetForge.slnx -c Release --no-build

      - name: Publish web
        run: dotnet publish src/PlanetForge.Presentation.Web/PlanetForge.Presentation.Web.csproj -c Release --no-restore -o ./artifacts/web

      - name: Upload temporary browser build for WebGL diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: planetforge-debug-web
          path: ./artifacts/web/wwwroot
          if-no-files-found: error

  browser-regression:
    name: Browser regressions (shard ${{ matrix.shard }}/3)
    needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download compiled WASM app from fast checks
        uses: actions/download-artifact@v4
        with:
          name: planetforge-debug-web
          path: ./artifacts/web/wwwroot

      - name: Install browser test dependencies
        working-directory: tests/PlanetForge.Browser.Tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser regression shard
        run: |
          python3 -m http.server 4173 --directory ./artifacts/web/wwwroot > /tmp/planetforge-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          cd tests/PlanetForge.Browser.Tests
          # A checked-in test manifest balances measured runtime and fails closed if a spec is unassigned.
          # One Playwright worker per runner prevents WebGL resource contention.
          node runBrowserShard.mjs ${{ matrix.shard }}

      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-visual-regression-shard-${{ matrix.shard }}
          path: tests/PlanetForge.Browser.Tests/artifacts
          if-no-files-found: ignore
