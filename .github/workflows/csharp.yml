name: Validate PlanetForge

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'PlanetForge.slnx'
      - 'Directory.Build.props'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore
        run: dotnet restore PlanetForge.slnx

      - name: Build
        run: dotnet build PlanetForge.slnx -c Release --no-restore

      - name: Validate browser JavaScript
        run: find src/PlanetForge.Presentation.Web/wwwroot/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Reject whole-canvas planet grayscale filters
        run: |
          if grep -R -n -E '#planet-canvas[^\{]*\{[^}]*filter:[^;}]*grayscale|pre-vegetation-world[^\{]*#planet-canvas[^\{]*\{[^}]*filter:' src/PlanetForge.Presentation.Web/wwwroot/css; then
            echo 'Whole-canvas planet filters are forbidden; land/water palettes must be handled in the renderer.'
            exit 1
          fi

      - name: Test
        run: dotnet test PlanetForge.slnx -c Release --no-build

      - name: Publish web
        run: dotnet publish src/PlanetForge.Presentation.Web/PlanetForge.Presentation.Web.csproj -c Release --no-restore -o ./artifacts/web

      - name: Install browser test dependencies
        working-directory: tests/PlanetForge.Browser.Tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run foundation visual regression
        run: |
          python3 -m http.server 4173 --directory ./artifacts/web/wwwroot > /tmp/planetforge-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          cd tests/PlanetForge.Browser.Tests
          npm test

      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-visual-regression
          path: tests/PlanetForge.Browser.Tests/artifacts
          if-no-files-found: ignore
