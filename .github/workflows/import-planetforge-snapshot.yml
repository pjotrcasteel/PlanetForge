name: Restore PlanetForge snapshot datasets
on:
  push:
    branches:
      - import/planetforge-user-snapshot-2026-10-16
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore binary assets from temporary parts
        shell: bash
        run: |
          set -euo pipefail
          destination="src/PlanetForge.Presentation.Web/wwwroot/data/earth"
          mkdir -p "$destination"
          cat .snapshot-import/frames.bin.part* | base64 --decode > "$destination/frames.bin"
          cat .snapshot-import/paleo.bin.part* | base64 --decode > "$destination/paleo.bin"
          cat .snapshot-import/present.bin.part* | base64 --decode > "$destination/present.bin"
          test "$(git hash-object "$destination/frames.bin")" = "7ce4cd926da349b622b1805ba632c4877ff6575d"
          test "$(git hash-object "$destination/paleo.bin")" = "481e0149fccbcf91592a499a36f59b8c77d58e56"
          test "$(git hash-object "$destination/present.bin")" = "98574ef6abd113d88b13be99e857c2d392468e16"
          test "$(git hash-object "$destination/rotations.bin")" = "457ccde52ae0ac3431645791d903c7f380ae18e7"
      - name: Commit verified datasets and clean temporary importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/PlanetForge.Presentation.Web/wwwroot/data/earth/{frames,paleo,present}.bin
          git rm -r .snapshot-import
          git rm .github/workflows/import-planetforge-snapshot.yml
          git commit -m "data: restore exact PlanetForge Earth-history assets"
          git push origin HEAD:refs/heads/import/planetforge-user-snapshot-2026-10-16
