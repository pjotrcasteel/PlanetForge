name: Deploy PlanetForge demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PlanetForge.slnx

      - name: Build
        run: dotnet build PlanetForge.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PlanetForge.slnx -c Release --no-build

      - name: Publish web
        run: dotnet publish src/PlanetForge.Presentation.Web/PlanetForge.Presentation.Web.csproj -c Release --no-restore -o ./artifacts/web

      - name: Prepare GitHub Pages
        run: |
          INDEX=./artifacts/web/wwwroot/index.html
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_VERSION="$(awk -F "'" '/^const buildVersion = / {print $2}' src/PlanetForge.Presentation.Web/wwwroot/js/buildVersion.js)"
          test -n "$BUILD_VERSION"
          sed -i 's#<base href="/" />#<base href="/PlanetForge/" />#' "$INDEX"
          sed -i "s#css/app.css\"#css/app.css?v=${GITHUB_SHA}\"#" "$INDEX"
          sed -i "s#css/mission-clarity.css\"#css/mission-clarity.css?v=${GITHUB_SHA}\"#" "$INDEX"
          sed -i "s#css/planet-run.css\"#css/planet-run.css?v=${GITHUB_SHA}\"#" "$INDEX"
          sed -i "s#css/hydrology-foundation.css\"#css/hydrology-foundation.css?v=${GITHUB_SHA}\"#" "$INDEX"
          sed -i "s#css/foundation-simulator.css\"#css/foundation-simulator.css?v=${GITHUB_SHA}\"#" "$INDEX"
          sed -i "s#js/buildVersion.js\"#js/buildVersion.js?v=${GITHUB_SHA}\"#" "$INDEX"
          sed -i "s#__BUILD_SHA_SHORT__#${SHORT_SHA}#g" "$INDEX"
          sed -i "s#__BUILD_VERSION__#${BUILD_VERSION}#g" "$INDEX"
          touch ./artifacts/web/wwwroot/.nojekyll
          test -f ./artifacts/web/wwwroot/_framework/blazor.webassembly.js
          grep -q '<base href="/PlanetForge/" />' "$INDEX"
          grep -q "hydrology-foundation.css?v=${GITHUB_SHA}" "$INDEX"
          grep -q "foundation-simulator.css?v=${GITHUB_SHA}" "$INDEX"
          grep -Fq "PF ${BUILD_VERSION} · ${SHORT_SHA}" "$INDEX"
          if grep -Eq '__BUILD_SHA_SHORT__|__BUILD_VERSION__' "$INDEX"; then
            echo 'Build identity placeholders were not replaced.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./artifacts/web/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify published planet
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Playwright
        working-directory: tests/PlanetForge.Browser.Tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify live GitHub Pages actually boots
        working-directory: tests/PlanetForge.Browser.Tests
        env:
          PLANETFORGE_BASE_URL: https://pjotrcasteel.github.io/PlanetForge
          PLANETFORGE_DEPLOY_SMOKE: '1'
          PLANETFORGE_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            if npx playwright test deployment.spec.mjs; then
              exit 0
            fi
            echo "Published page is not ready (attempt ${attempt}). Retrying…"
            sleep 15
          done
          exit 1
